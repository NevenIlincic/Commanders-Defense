[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
rapier2d = "0.32.0"
bincode = "1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
crossbeam = "0.8"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
dotenvy = "0.15"
sqlx = { version = "0.7", features = [ "runtime-tokio", "tls-rustls", "postgres", "macros", "chrono" ] }
bcrypt = "0.15"
jsonwebtoken = "9.3"
chrono = "0.4"
once_cell = "1.19"
axum-extra = { version = "0.9", features = ["typed-header"] }
rand = "0.8"
sysinfo = "0.30"